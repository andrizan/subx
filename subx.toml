# subx.toml — default config (all optional; CLI flags always win).
workers = 8
lang_priority = ["id"]
default_font = "Arial"

# Self-hosting recommended (docker: libretranslate/libretranslate --load-only en,id,ja).
# Public instances need an api_key.
libre_url = "http://localhost:5000"
# libre_api_key = "fill-in-for-public-instance"

# --- AI engine (OpenAI-compatible): OpenAI, OpenRouter, DeepSeek, Gemini,
# local Ollama/LM Studio, opencode / other OpenAI-compatible services.
# translate_engine = "libre"  # or "ai"
# ai_base_url = "https://api.openai.com/v1"
# ai_model = "gpt-4o-mini"
#
# An API key MAY go here via `ai_api_key`, but env is RECOMMENDED
# ($env:OPENROUTER_API_KEY="sk-or-...") or the `subx.local.toml` file
# (gitignored, never committed) so the key can't leak into git:
#   ai_api_key = "sk-or-..."

# --- encode: StaxRip-driven batch encode (docs/USAGE.md#encode). Machine-specific
# values belong in subx.local.toml; every CLI flag wins over these.
# [tools]
# staxrip_dir = "D:/Apps/StaxRip"       # folder with StaxRip.exe (required)
# [encode]
# template = "Anime-480p.AV1.Opus96"     # StaxRip template (required)
# prefix = "[GROUP]"                     # output name prefix, "" for none
# tag = "BD 480p AV1.Opus"               # tag in parentheses, "" for none
# resolution = "848x480"                 # "" keeps the template's size
# audio_lang = "jpn"
# sub_lang = "id"
#
# Native engine (no StaxRip): engine = "native" plus one profile per release type.
# `video` is the encoder command line copied from StaxRip's log/preview.
# engine = "native"
# profile = "anime480p"
# jobs = 1
# [encode.profiles.anime480p]
# tag = "BD 480p AV1.Opus"
# width = 848
# height = 480
# encoder = "svt-av1"                     # svt-av1 | x265
# video = ["--rc", "0", "--crf", "35", "--preset", "4", "--tune", "2"]
# audio = { codec = "opus", bitrate = 96 }   # opus | aac-lc | he-aac | he-aac-v2
