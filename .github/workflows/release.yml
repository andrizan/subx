name: Release

# Runs only on version tags (v*). The tag must match Cargo.toml, then the
# shared build matrix (build.yml) produces one binary per supported target,
# which is packaged with docs and config examples, checksummed and published
# together with a git-cliff changelog.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          crate="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    name: Build
    needs: guard
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-cliff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Package archives + SHA256SUMS
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist stage
          for dir in artifacts/subx-*; do
            target="${dir#artifacts/subx-}"
            name="subx-${version}-${target}"
            mkdir -p "stage/$name"
            cp README.md LICENSE subx.toml subx.local.toml.example "stage/$name/"
            case "$target" in
              *windows*)
                cp "$dir/subx.exe" "stage/$name/"
                (cd stage && zip -qr "../dist/$name.zip" "$name")
                ;;
              *)
                cp "$dir/subx" "stage/$name/"
                chmod +x "stage/$name/subx"
                tar -C stage -cJf "dist/$name.tar.xz" "$name"
                ;;
            esac
          done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Changelog (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
