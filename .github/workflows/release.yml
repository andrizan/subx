name: Release

# Runs only on version tags (v*). The tag must match Cargo.toml, then the
# shared build matrix (build.yml) produces one binary per supported target,
# which is packaged with docs and config examples, checksummed and published
# together with a git-cliff changelog.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release

env:
  CARGO_TERM_COLOR: always

jobs:
  guard:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          crate="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    name: Build
    needs: guard
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-cliff)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Package archives + SHA256SUMS
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist stage
          for dir in artifacts/subx-*; do
            target="${dir#artifacts/subx-}"
            name="subx-${version}-${target}"
            mkdir -p "stage/$name"
            cp README.md LICENSE subx.toml subx.local.toml.example "stage/$name/"
            case "$target" in
              *windows*)
                cp "$dir/subx.exe" "stage/$name/"
                (cd stage && zip -qr "../dist/$name.zip" "$name")
                ;;
              *)
                cp "$dir/subx" "stage/$name/"
                chmod +x "stage/$name/subx"
                tar -C stage -cJf "dist/$name.tar.xz" "$name"
                ;;
            esac
          done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Changelog (git-cliff)
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true

  aur:
    name: Publish to AUR (subx-bin)
    needs: release
    # makepkg rejects a "-" in pkgver, so pre-release tags (v1.4.0-rc.1) stay off the AUR.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: /home/builder/subx-bin
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git openssh

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render PKGBUILD from the published release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          curl -fsSL -o SHA256SUMS \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/SHA256SUMS"
          sum() { awk -v f="subx-${version}-$1-unknown-linux-musl.tar.xz" '$2 == f { print $1 }' SHA256SUMS; }
          x86_64="$(sum x86_64)"
          aarch64="$(sum aarch64)"
          if [ -z "$x86_64" ] || [ -z "$aarch64" ]; then
            echo "::error::Linux musl archives for $version are missing from SHA256SUMS"
            exit 1
          fi
          useradd -m builder
          install -d -o builder "$BUILD_DIR"
          sed -e "s/^pkgver=.*/pkgver=${version}/" \
              -e "s/^pkgrel=.*/pkgrel=1/" \
              -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${x86_64}')/" \
              -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${aarch64}')/" \
              pkg/aur/PKGBUILD > "$BUILD_DIR/PKGBUILD"
          chown builder "$BUILD_DIR/PKGBUILD"

      # makepkg refuses root; --nodeps because only the package layout is under test.
      - name: Build package + .SRCINFO
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          set -euo pipefail
          runuser -u builder -- makepkg --nodeps --noconfirm --force
          ./pkg/subx-bin/usr/bin/subx --version
          runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
          cat .SRCINFO

      - name: Push to the AUR
        working-directory: ${{ env.BUILD_DIR }}
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::secret AUR_SSH_PRIVATE_KEY is not set"
            exit 1
          fi
          # ssh reads ~ from passwd, not $HOME, so every path is passed explicitly.
          ssh_dir="$RUNNER_TEMP/aur-ssh"
          install -d -m 700 "$ssh_dir"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          # Host key as published on https://aur.archlinux.org (SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4).
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_dir/known_hosts -o StrictHostKeyChecking=yes"
          git clone ssh://aur@aur.archlinux.org/subx-bin.git aur
          cp PKGBUILD .SRCINFO aur/
          cd aur
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "subx-bin is already at $version on the AUR"
            exit 0
          fi
          git -c user.name=andrizan -c user.email=me@andrizan.com commit -m "Update to $version"
          git push origin HEAD:master
