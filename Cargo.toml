[package]
name = "subx"
version = "1.0.0"
edition = "2024"
description = "All-in-one fansub toolkit: extract/clean/shift/mux/convert/translate subs"
license = "Unlicense"

[[bin]]
name = "subx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chardetng = "0.1"
clap = { version = "4.5", features = ["derive", "suggestions"] }
console = "0.15"
encoding_rs = "0.8"
futures = "0.3"
indicatif = "0.17"
once_cell = "1.19"
rayon = "1.10"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.6"
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
which = "6.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
strip = true
opt-level = 3
