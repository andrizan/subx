[package]
name = "subx"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "All-in-one fansub toolkit: extract/clean/shift/mux/convert/translate subs"
license = "Unlicense"

[[bin]]
name = "subx"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "suggestions"] }
futures = "0.3"
indicatif = "0.18"
regex = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "process", "time", "sync", "net", "io-util"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
which = "6.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
strip = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
