# cargo-deny policy (run: `make deny` / CI job `deny`).
# Docs: https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is pulled in by indicatif 0.17 only; removed by the indicatif 0.18 bump planned in docs/DESIGN.md phase 1" },
]

[licenses]
# Permissive licenses only; the binary itself is Unlicense.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla root store data)
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
